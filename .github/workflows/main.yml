name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Switched to JDK 17 as required by modern AI Studio Gradle templates
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Installs Gradle 8.9 (matches gradle-wrapper.properties) instead of the runner's 9.x
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9
        validate-wrappers: false

    # ---------------------------------------------------------------------------------------------
    # SIGNING
    # The default debug keystore is generated fresh on every runner, so each downloaded APK has a
    # different signing SHA-1. Google Play services looks up the Android OAuth client by
    # package name + SHA-1, so a token request from a "new" key fails with:
    #     GoogleAuthException: UnregisteredOnApiConsole
    #
    # Set the repository secret DEBUG_KEYSTORE_BASE64 (base64 of a .jks you keep) to get a stable
    # SHA-1 that stays valid forever. Without the secret the build still works and prints the SHA-1
    # it used, but that SHA-1 changes on the next run.
    # ---------------------------------------------------------------------------------------------
    - name: Restore stable debug keystore (optional)
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "No DEBUG_KEYSTORE_BASE64 secret set - using the runner's throwaway debug key."
          exit 0
        fi
        mkdir -p "$HOME/.android"
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
        echo "Restored a stable debug keystore - the SHA-1 below will not change between builds."

    - name: Show signing SHA-1 (register this in Google Cloud Console)
      run: |
        KS="$HOME/.android/debug.keystore"
        echo "### Signing fingerprint for this APK" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        keytool -list -v -keystore "$KS" -alias androiddebugkey \
          -storepass android -keypass android 2>/dev/null | grep -E "SHA1:|SHA256:" | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "Package name: com.example.callrecorder"
        echo "Register both values under APIs & Services > Credentials > OAuth client ID > Android."

    # Compiles the application and generates the APK
    - name: Build with Gradle
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-build.log
      continue-on-error: true

    # The raw log lives on a blob store that is not always reachable; mirror every compiler
    # diagnostic into a workflow annotation so failures are visible in the run summary, in the
    # Checks API, and in `gh run view` output.
    - name: Report build failures as annotations
      if: always()
      run: |
        if [ ! -s /tmp/gradle-build.log ]; then
          echo "::warning::No build log produced."
          exit 0
        fi
        if grep -q "BUILD SUCCESSFUL" /tmp/gradle-build.log; then
          echo "Build succeeded - no annotations to report."
          exit 0
        fi
        sed -e 's/\x1b\[[0-9;]*m//g' /tmp/gradle-build.log \
          | grep -E "^e: file|^w: file.*error|error: |\* What went wrong|Execution failed for task" \
          | sed -e 's/%/%25/g' -e 's/\r//' \
          | head -n 60 \
          | cut -c1-450 \
          | while IFS= read -r line; do
              echo "::error::${line}"
            done
        exit 1

    # This uploads the generated file so you can click and download it
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
