name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Call Recorder APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Android Source Files Exist
        run: |
          if [ ! -d "app" ]; then
            echo "Fetching latest Android project bundle..."
            curl -L -o project.zip "https://ais-pre-6friiiyrmpckqbdth6umjs-282538280070.europe-west2.run.app/CallRecorder_Android_Project.zip" || true
            if [ -f "project.zip" ]; then
              unzip -o project.zip || true
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
