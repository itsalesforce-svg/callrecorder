name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Switched to JDK 17 as required by modern AI Studio Gradle templates
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Installs Gradle 8.9 (matches gradle-wrapper.properties) instead of the runner's 9.x
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9
        validate-wrappers: false

    # Compiles the application and generates the APK
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    # This uploads the generated file so you can click and download it
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
