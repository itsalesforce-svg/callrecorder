name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Switched to JDK 17 as required by modern AI Studio Gradle templates
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Installs Gradle 8.9 (matches gradle-wrapper.properties) instead of the runner's 9.x
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9
        validate-wrappers: false

    # ---------------------------------------------------------------------------------------------
    # SIGNING AND A STABLE SHA-1
    #
    # Google Play services resolves the Android OAuth client by package name + signing SHA-1, and the
    # legacy GoogleAuthUtil flow has no client id in the code. A runner generates a brand-new debug
    # keystore for every build, so each downloaded APK has a different SHA-1 and the value registered
    # in Cloud Console dies on the next run:
    #     GoogleAuthException: UnregisteredOnApiConsole
    #
    # Fix: keep ~/.android/debug.keystore in the Actions cache under a fixed key. The first run
    # creates it, every later run restores the same file, so the SHA-1 never changes again and the
    # Cloud Console registration stays valid. No secret has to be created.
    #
    # The optional DEBUG_KEYSTORE_BASE64 secret still wins when present (use it if you would rather
    # keep the key outside the cache, or if GitHub ever evicts the cache entry).
    # ---------------------------------------------------------------------------------------------
    - name: Restore persisted debug keystore cache
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Create the debug keystore if the cache was empty
      run: |
        mkdir -p "$HOME/.android"
        if [ -f "$HOME/.android/debug.keystore" ]; then
          echo "Reusing the cached debug keystore - the SHA-1 below is stable." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        keytool -genkeypair -v \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android -keypass android \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        echo "KEYSTORE_REGENERATED=1" >> "$GITHUB_ENV"
        echo "No cached keystore - generated one and cached it for every future build."

    - name: Apply DEBUG_KEYSTORE_BASE64 override (optional)
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "No DEBUG_KEYSTORE_BASE64 secret - using the cached keystore."
          exit 0
        fi
        mkdir -p "$HOME/.android"
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
        unset KEYSTORE_REGENERATED
        echo "Restored the keystore from DEBUG_KEYSTORE_BASE64 - this SHA-1 is your long-term one."

    - name: Show signing SHA-1 (register this in Google Cloud Console)
      run: |
        KS="$HOME/.android/debug.keystore"
        if [ -n "$KEYSTORE_REGENERATED" ]; then
          echo "::warning::The cached debug keystore was missing, so a new one was created. This APK's SHA-1 differs from the previous build; it is now cached again and will not change unless the cache is evicted. Re-register the SHA-1 printed below."
        fi
        echo "### Signing fingerprint for this APK" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        FP=$(keytool -list -v -keystore "$KS" -alias androiddebugkey \
          -storepass android -keypass android 2>/dev/null | grep -E "SHA1:|SHA256:")
        echo "$FP" | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "Package name: com.example.callrecorder" >> "$GITHUB_STEP_SUMMARY"
        echo "Register both values under APIs & Services > Credentials > OAuth client ID > Android." >> "$GITHUB_STEP_SUMMARY"
        SHA1=$(echo "$FP" | sed -n 's/.*SHA1: *//p')
        echo "Package name: com.example.callrecorder"
        echo "::notice title=Signing SHA-1 register this in Cloud Console::$SHA1"

    # Compiles the application and generates the APK
    - name: Build with Gradle
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-build.log
      continue-on-error: true

    # The raw log lives on a blob store that is not always reachable; mirror every compiler
    # diagnostic into a workflow annotation so failures are visible in the run summary, in the
    # Checks API, and in `gh run view` output.
    - name: Report build failures as annotations
      if: always()
      run: |
        if [ ! -s /tmp/gradle-build.log ]; then
          echo "::warning::No build log produced."
          exit 0
        fi
        if grep -q "BUILD SUCCESSFUL" /tmp/gradle-build.log; then
          echo "Build succeeded - no annotations to report."
          exit 0
        fi
        sed -e 's/\x1b\[[0-9;]*m//g' /tmp/gradle-build.log \
          | grep -E "^e: file|^w: file.*error|error: |\* What went wrong|Execution failed for task" \
          | sed -e 's/%/%25/g' -e 's/\r//' \
          | head -n 60 \
          | cut -c1-450 \
          | while IFS= read -r line; do
              echo "::error::${line}"
            done
        exit 1

    # This uploads the generated file so you can click and download it
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
